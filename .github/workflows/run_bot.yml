name: MAI Firma Tarayıcı Botu

on:
  workflow_dispatch: # GitHub üzerinden manuel olarak "Run workflow" demeni sağlar
  schedule:
    - cron: '0 2 * * *' # Her gece saat 02:00'da otomatik çalışması için (isteğe bağlı)

jobs:
  scrape_and_analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Tarama ve Yapay Zeka Analizini Başlat
      env:
        AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python tarama.py
